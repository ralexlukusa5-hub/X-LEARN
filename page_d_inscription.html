<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'inscription</title>

    <!-- lien css -->
    <link rel="stylesheet" href="style_page_d_inscription.css">
    <!-- lien icones-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- lien favicon-->
    <link rel="shortcut icon" href="Images/Logo X-LEARN.png">
</head>

<body>
    <section>
        <h1>INSCRIPTION</h1>
        <div class="input-box">
            <input type="text" placeholder="email">
            <i class="fa-solid fa-envelope"></i>
        </div>

        <div class="input-box">
            <input type="text" placeholder="Nom d'utilisateur">
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Entrez un mot de passe">
            <i class="fa-solid fa-lock"></i>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Confirmez le mot de passe">
            <i class="fa-solid fa-lock"></i>
        </div>

        <button class="login-btn">Créer un compte</button>

    </section>
</body>
</html>
